<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPTA</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</head>
<body>
    <header>
      <div class="flex">
        <div class="logo">
            <img src="" alt="">
            <h4>CTA</h4>
        </div>
      </div>
    <div class="flex">
      <form class="search-bar" onsubmit="return false">
          <ion-icon name="search"></ion-icon>
          <input class="search-input" type="text" name="location" id="location" placeholder="Where would you like to go?" autocomplete="off">
          <button class="btn search-btn">Search</button>
      </form>

      <button id="sidenavBtn">
        <ion-icon class="hamburger" name="menu"></ion-icon>
      </button>
    </div>
    </header>

    <section class="sidenav" id="sidenav">
      <p class="link homeBtn">Home</p>
      <p class="link aboutUsBtn">About Us</p>
    </section>

    <section class="slideshow-container">

        <div class="homeSlide">
            <h2 class="slide-location">The Sea</h2>
            <img src="./images/seascape 1.webp" alt="A seascape">
        </div>

        <div class="homeSlide">
            <h2 class="slide-location">2</h2>
            <img src="./images/seascape 2.webp" alt="A seascape">
        </div>

        <div class="homeSlide">
            <h2 class="slide-location">3</h2>
            <img src="./images/seascape 3.webp" alt="A seascape">
        </div>

        <div class="homeSlide">
            <h2 class="slide-location">4</h2>
            <img src="./images/seascape 4.jpeg" alt="A seascape">
        </div>


        <div class="dots-wrapper">
        <div class="dot dot-active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        </div>
    
  </section>

    <div class="location-container">
      <section class="tabbar-header">
        <h1>Top Locations</h4>
        <p class="filter"></p>
      </section>
        

        <div class="tabbar">
          <button class="btn homeTab tabbtn btn-active" data-tabid="All">All</button>
          <button class="btn homeTab tabbtn" data-tabid="Food">Food & Drinks</button>
          <button class="btn homeTab tabbtn" data-tabid="Visit">Visit</button>
          <button class="btn homeTab tabbtn" data-tabid="Stay">Stay</button>
        </div>

        <div class="location-wrapper"></div>


    </div>

    <div class="modal-wrapper"></div>

    <div class="aboutUsContainer hide">
        <a href="#" class="aboutUsLink" id="aboutUsCloseBtn">
            <ion-icon name="close-circle"></ion-icon>
        </a>
        <h1 class="aboutUsTitle">About Us</h1>
        <h4>Creators:</h4>
        <ul>Chris</ul>
        <ul></ul>
        <ul></ul>
    </div>
        












    <footer class="flex">
      <div>
        <p>© 2026 Phnom Penh Travel Assistant. </p>
        <p>All rights reserved.</p>
      </div>
      <div class="flex">
        <p class="link">Terms of Service</p>
        <p class="link">|</p>
        <p class="link">Privacy Policy</p>
      </div>
      
    </footer>
    <script type="module" src="script.js"></script>
</body>
</html>
